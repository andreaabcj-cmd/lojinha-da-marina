<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Modelo de tutorial</title>
<!--
  MODELO DE TUTORIAL · Lojinha da Marina
  Para fazer um tutorial novo:
   1. Tire os prints (o ideal é pelo fluxo do projeto: _gravacoes + preparar_prints.py, que censura dados pessoais).
   2. Troque o bloco window.TUTORIAL_PT abaixo:
      - etapas: id, bloco, titulo, resumo, porque (lista), checklist (lista), status ("pronto"/"parcial"/"em breve")
      - passos: id, etapa, tipo ("passo"/"erro"/"alternativo"), img (arquivo ou data:), w, h,
                alvo [x, y, largura, altura] em frações do print (0 a 1), titulo, texto, dica, clique (true/false)
   3. Abra este arquivo no navegador. Nada mais é preciso.
-->
<style>
/* ============ LOJINHA DA MARINA · visual ============ */
:root{--ink:#16294A;--ink2:#3A4D6B;--muted:#64748B;--line:#E2E8F0;--paper:#FAFBFD;--blue:#2F6FD6;--blue-d:#1F4FA8;--blue-l:#E7F0FF;--yellow:#F2B632;--yellow-l:#FFF4D6;
  --green:#1E9E55;--green-l:#E3F7EA;--red:#E0245E;--red-l:#FDE8EF;--r:14px;--sh:0 8px 24px rgba(22,41,74,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5;padding-top:34px}
a{color:var(--blue)}img{max-width:100%;display:block}
h1,h2,h3{line-height:1.15;margin:0 0 .4em}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.02em}h2{font-size:clamp(22px,3vw,32px);letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:2px solid var(--ink);background:var(--blue);color:#fff;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{background:#B9C3CE;cursor:not-allowed;box-shadow:none;transform:none}
.btn.ghost{background:#fff;color:var(--ink)}.btn.grande{padding:14px 24px;font-size:17px}.btn.amarelo{background:var(--yellow);color:var(--ink)}
code,.sku{font-family:Consolas,"Cascadia Mono",monospace;font-size:.86em;background:#EEF2F7;padding:1px 6px;border-radius:5px;color:var(--ink2)}
.vazio{padding:40px;text-align:center;color:var(--muted);background:#fff;border:2px dashed var(--line);border-radius:var(--r)}
.ok{color:var(--green);font-weight:700}.warn{color:#9A6A00;font-weight:700}

/* topo */
.topo{position:sticky;top:34px;z-index:50;display:flex;align-items:center;gap:20px;padding:12px max(20px,calc((100% - 1180px)/2));background:#fff;border-bottom:1px solid var(--line)}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.05}.marca b{font-size:18px}
.marca-ic svg{display:block;image-rendering:pixelated}
.busca{flex:1;display:flex;max-width:440px;margin-left:auto;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.busca input{flex:1;border:0;padding:10px 12px;font:inherit;outline:none;min-width:0}.busca button{border:0;background:var(--blue-l);padding:0 14px;cursor:pointer;font-size:16px}
.menu{display:flex;align-items:center;gap:6px}
.menu a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink2);font-weight:700;font-size:15px;white-space:nowrap}
.menu a:hover,.menu a.on{background:var(--blue-l);color:var(--blue)}
.carrinho{position:relative;font-size:20px}
.carrinho b{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;display:none;place-items:center}
@media(max-width:820px){.topo{flex-wrap:wrap}.busca{order:3;max-width:none;flex-basis:100%}.menu{margin-left:auto}.menu a{padding:6px 7px;font-size:14px}}

/* home */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding:46px 0 30px}
.hero p.lead{font-size:19px;color:var(--ink2);max-width:520px}.hero .acoes{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.vitrine{background:var(--blue-l);border-radius:22px;padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border:2px solid #CFDDF6}
.vitrine img{border-radius:12px;background:#fff;image-rendering:pixelated}
.selo-aula{display:inline-block;padding:5px 10px;border-radius:8px;background:var(--yellow-l);color:#7A5600;font-weight:800;font-size:13px;margin-bottom:12px}
.faixas{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:10px 0 34px}
.faixa{padding:20px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.faixa b{display:block;font-size:17px;margin:6px 0 4px}.faixa p{margin:0 0 12px;color:var(--muted);font-size:15px}
@media(max-width:820px){.hero,.faixas{grid-template-columns:1fr}}

/* grade de produtos */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin:16px 0 40px}
.card-prod{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);transition:.2s}
.card-prod:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(22,41,74,.13)}
.card-prod .foto{display:block;position:relative;background:#F2F5FA}.card-prod img{width:100%;aspect-ratio:1;object-fit:cover;image-rendering:pixelated}
.card-prod .info{padding:12px 14px 16px}.card-prod h3{font-size:17px;margin:0 0 4px;color:var(--ink)}.card-prod a{text-decoration:none}
.preco{font-weight:900;font-size:18px;margin:0 0 6px}
.selo{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:7px;background:var(--ink);color:#fff;font-size:12px;font-weight:800}
.coracao{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:19px;cursor:pointer;color:var(--red);transition:.15s}
.coracao:hover,.coracao.on{transform:scale(1.1);border-color:var(--red)}.coracao.grande{position:static;width:50px;height:50px;font-size:22px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.filtros a{padding:8px 14px;border-radius:20px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink2);font-weight:700}
.filtros a.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* produto */
.produto{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:30px 0}
.prod-foto img{width:100%;border-radius:20px;border:1px solid var(--line);image-rendering:pixelated}
.prod-preco{font-size:30px;font-weight:900;margin:6px 0 12px}.voltar{font-weight:700;text-decoration:none;font-size:14px}
.sku-linha{color:var(--muted);font-size:14px}
.tamanhos{margin:16px 0}.tamanhos div{display:flex;gap:8px;margin:8px 0}.tamanhos small{color:var(--muted)}
.tamanhos button{width:52px;height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;cursor:pointer}
.tamanhos button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.comprar{display:flex;gap:10px;align-items:center;margin-top:16px}.comprar input{width:70px;padding:12px;border:2px solid var(--line);border-radius:10px;font:inherit;font-weight:700}
@media(max-width:820px){.produto{grid-template-columns:1fr}}

/* carrinho / checkout / obrigado */
.itens{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:64px 1fr 70px 110px 40px;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.item img{width:64px;height:64px;border-radius:10px;image-rendering:pixelated}.item input{width:64px;padding:8px;border:2px solid var(--line);border-radius:8px;font:inherit}
.item button{border:0;background:none;cursor:pointer;font-size:16px;color:var(--muted)}
.resumo{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:16px 0 40px;padding:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.resumo span{color:var(--muted)}.resumo b{font-size:24px;margin-left:8px}
.duas{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;padding:24px 0 40px;align-items:start}
.painel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.campos label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink2)}
.campos input,.campos select,textarea{padding:10px 12px;border:2px solid var(--line);border-radius:9px;font:inherit;font-weight:500}
.campos .inteiro{grid-column:1/-1}
.alerta{padding:12px 14px;border-radius:10px;background:var(--yellow-l);color:#6E4B00;font-size:14px;margin:0 0 14px}
.alerta.azul{background:var(--blue-l);color:#123B7A}.alerta.verde{background:var(--green-l);color:#0D5A2C}
.pags{display:grid;gap:8px;margin:12px 0}.pags label{display:flex;gap:10px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:10px;cursor:pointer;font-weight:700}
.pags label:has(input:checked){border-color:var(--blue);background:var(--blue-l)}
.linha{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}.linha.total{border:0;font-size:18px}
.obrigado{text-align:center;padding:40px 0}.obrigado .check{width:70px;height:70px;margin:0 auto 12px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:900}
.obrigado .painel{max-width:520px;margin:20px auto;text-align:left}
.horas{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.horas button{padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.horas button.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
@media(max-width:820px){.duas,.campos{grid-template-columns:1fr}.item{grid-template-columns:52px 1fr 60px;}.item span,.item button{grid-column:auto}}

/* aula / catálogo */
.aula h2{margin-top:34px}.aula ol,.aula ul{padding-left:22px}.aula li{margin:6px 0}
.mapa-aula{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:16px 0}
.mapa-aula div{padding:16px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.mapa-aula b{display:block;font-size:16px;margin-bottom:4px}.mapa-aula p{margin:0;color:var(--muted);font-size:14.5px}
.check-lista li{list-style:none;margin-left:-22px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tabela{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin:14px 0}
.tabela table{border-collapse:collapse;font-size:13px;min-width:1100px}.tabela th,.tabela td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tabela th{background:#F4F7FB;font-family:Consolas,monospace}.tabela td img{width:44px;height:44px;image-rendering:pixelated;border-radius:6px}

/* rodapé */
.rodape{margin-top:40px;background:var(--ink);color:#C9D6E8;padding:36px 0 20px}
.rod-grid{max-width:1180px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:30px}
.rod-grid b{color:#fff;display:block;margin-bottom:8px}.rod-grid a{display:block;color:#C9D6E8;text-decoration:none;padding:3px 0}.rod-grid a:hover{color:#fff}
.rod-grid p{margin:0 0 10px;font-size:14.5px}.aviso{padding:10px 12px;border-radius:10px;background:rgba(255,224,122,.12);color:#FFE9A8}
.news .linha{display:flex;gap:8px;border:0;padding:0}.news input{flex:1;min-width:0;padding:10px;border-radius:9px;border:0;font:inherit}
.rod-fim{max-width:1180px;margin:24px auto 0;padding:14px 20px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#8FA3C2}
@media(max-width:820px){.rod-grid{grid-template-columns:1fr}}

/* ================= MODO AULA ================= */
.ma-faixa{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:34px;padding:5px 12px;background:#FFE07A;color:var(--ink);font-size:13px;font-weight:700}
.ma-pix{padding:2px 9px;border-radius:6px;background:rgba(22,41,74,.1)}.ma-pix.live{background:var(--green);color:#fff}.ma-pix.lab{background:var(--red);color:#fff}
.ma-fab{position:fixed;right:18px;bottom:18px;z-index:95;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:12px;border:3px solid var(--ink);background:#fff;font:800 15px "Segoe UI",sans-serif;color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.ma-fab:hover{transform:translate(-1px,-1px)}.ma-mascote svg{display:block}
.ma-badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--blue);color:#fff;font-size:12px;display:grid;place-items:center}
.ma-badge.pop{animation:maPop .4s}@keyframes maPop{50%{transform:scale(1.4)}}
.ma-panel{position:fixed;top:34px;right:0;bottom:0;z-index:96;width:min(480px,100vw);background:#fff;border-left:3px solid var(--ink);box-shadow:-10px 0 40px rgba(0,0,0,.15);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ma-panel.open{transform:none}
.ma-panel header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--ink);color:#fff}
.ma-panel header small{display:block;color:#AFC2E2;font-size:12.5px}.ma-panel header button{border:0;background:rgba(255,255,255,.12);color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer}
.ma-tabs{display:flex;gap:4px;padding:8px;background:#F4F7FB;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ma-tabs button{flex:1;padding:7px 6px;border-radius:8px;border:0;background:transparent;font:700 13px "Segoe UI",sans-serif;cursor:pointer;color:var(--ink2);white-space:nowrap}
.ma-tabs button.on{background:var(--ink);color:#fff}
.ma-body{flex:1;overflow:auto;padding:14px 16px 90px;font-size:14px}
.ma-body h4{margin:16px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ma-intro{margin:0 0 12px;padding:10px 12px;background:var(--blue-l);border-radius:10px;color:#123B7A}
.ma-mut{color:var(--muted);font-size:13px}
.ma-ev{border:2px solid var(--line);border-radius:10px;margin:8px 0;background:#fff}.ma-ev.lost{border-color:var(--red);background:#FFF6F9}
.ma-ev summary{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;list-style:none}
.ma-ev summary::-webkit-details-marker{display:none}.ma-ev summary b{font-family:Consolas,monospace;font-size:15px}.ma-ev summary time{margin-left:auto;color:var(--muted);font-size:12px}
.ma-ev .ma-ex{margin:0 12px 8px;color:var(--ink2)}
.ma-st{padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:800;white-space:nowrap}
.ma-st.ok{background:var(--green-l);color:var(--green)}.ma-st.sim{background:#EEF2F7;color:var(--ink2)}.ma-st.warn{background:var(--yellow-l);color:#8A5A00}.ma-st.bad{background:var(--red-l);color:var(--red)}
.ma-tag{padding:1px 7px;border-radius:6px;background:#EEEAFF;color:#5B3FE0;font-size:11px;font-weight:800}.ma-tag.big{font-size:12px;padding:3px 9px}
.ma-params{margin:0 12px 8px;padding:8px 10px;background:#F7F9FC;border-radius:8px;font-size:13px;word-break:break-all}.ma-params div{padding:2px 0}
.ma-code{margin:0 12px 12px;padding:10px 12px;background:#0B1424;color:#C9D6E8;border-radius:8px;font:12.5px/1.55 Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.ma-code.big{margin:0;max-height:440px;overflow:auto}.ma-code mark{background:#FFE07A;color:#16294A;border-radius:3px;padding:0 2px}
.ma-alert{margin:0 12px 8px;padding:8px 10px;border-radius:8px;background:var(--red-l);color:#7A1235;font-weight:700}.ma-alert.warn{background:var(--yellow-l);color:#6E4B00}
.ma-req{display:grid;gap:4px;padding:8px 10px;margin:6px 0;border-radius:8px;border:1px solid var(--line);background:#F7F9FC}.ma-req.ok{border-color:#9FDDB8;background:#F2FCF6}.ma-req.bad{border-color:#F3B4C6;background:#FFF6F9}
.ma-req code{font-size:11.5px;word-break:break-all;background:none;padding:0}.ma-req span{font-size:12px;color:var(--muted)}
.ma-legend{margin-top:12px;padding:10px;border-radius:8px;background:#F4F7FB;font-size:13px}
.ma-pixel{padding:12px;border-radius:10px;border:2px solid var(--line)}.ma-pixel div{display:flex;justify-content:space-between;align-items:center}
.ma-lrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;margin:5px 0;border-radius:8px;background:#F7F9FC;border-left:4px solid var(--line);font-size:13px}
.ma-lrow.ok{border-left-color:var(--green)}.ma-lrow.warn{border-left-color:var(--yellow)}.ma-lrow.bad{border-left-color:var(--red)}.ma-lrow span{color:var(--ink2);text-align:right;word-break:break-all}
.ma-lab{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px;margin:7px 0;border:2px solid var(--line);border-radius:10px;cursor:pointer}
.ma-lab.on{border-color:var(--red);background:#FFF6F9}.ma-lab input{display:none}.ma-lab small{display:block;color:var(--muted);font-weight:600}
.ma-sw{width:38px;height:22px;border-radius:12px;background:#CBD5E1;position:relative;transition:.2s}.ma-sw:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.ma-lab input:checked+.ma-sw{background:var(--red)}.ma-lab input:checked+.ma-sw:after{left:19px}
.ma-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ma-btn{padding:9px 14px;border-radius:9px;border:2px solid var(--ink);background:var(--blue);color:#fff;font:800 13.5px "Segoe UI",sans-serif;cursor:pointer}.ma-btn.ghost{background:#fff;color:var(--ink)}
.ma-dica h3{margin:10px 0 6px}.ma-evs{display:flex;gap:6px;flex-wrap:wrap}.ma-evs span{padding:4px 9px;border-radius:7px;background:var(--blue-l);color:var(--blue);font-weight:700;font-family:Consolas,monospace;font-size:12.5px}
.ma-ol{padding-left:20px}.ma-ol li{margin:3px 0}
.ma-toasts{position:fixed;left:18px;bottom:18px;z-index:97;display:grid;gap:8px;max-width:360px}
.ma-toast{padding:10px 14px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:maIn .35s cubic-bezier(.2,.8,.2,1);transition:.5s}
.ma-toast small{color:#AFC2E2}.ma-toast.out{opacity:0;transform:translateY(10px)}
@keyframes maIn{from{opacity:0;transform:translateY(12px)}}
.ma-cookie{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:98;width:min(720px,calc(100vw - 24px));display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 18px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink)}
.ma-cookie p{margin:4px 0 0;font-size:14px}
@media(max-width:640px){.ma-cookie{flex-direction:column;align-items:flex-start}.ma-fab span:not(.ma-mascote){display:none}}

/* Tutoriais passo a passo · mesmo visual da Lojinha (toldo, bordas grossas, sombra "pixel") */
.tu{max-width:1080px;margin:0 auto;padding:18px 0 60px}
.tu h1{font-size:30px;margin:6px 0 6px;display:flex;align-items:center;gap:12px}
.tu .lead{font-size:18px;color:var(--ink2);margin:0 0 18px;max-width:820px}
.tu-voltar{font-weight:700;text-decoration:none}
.tu-bloco-nome{margin:14px 0 0;color:var(--muted);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.06em}
.tu-num{display:inline-grid;place-items:center;min-width:44px;height:36px;padding:0 8px;border-radius:9px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font:800 17px/1 Consolas,monospace}

/* lista */
.tu-bloco h2{margin:28px 0 12px;font-size:20px}
.tu-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tu-card{position:relative;display:block;padding:16px 16px 44px;background:#fff;border:2px solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--ink);color:var(--ink);text-decoration:none;transition:.12s}
.tu-card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.tu-card b{display:block;margin:10px 0 4px;font-size:17px}.tu-card p{margin:0;color:var(--muted);font-size:14px}
.tu-card.off{opacity:.55;border-style:dashed;box-shadow:none}
.tu-st{position:absolute;left:16px;bottom:12px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#EEF2F7;color:var(--ink2)}
.tu-st.pronto{background:var(--green-l);color:var(--green)}.tu-st.parcial{background:var(--yellow-l);color:#7A5600}

/* player */
.tu-player{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;outline:none}
.tu-player::before{content:"";display:block;height:16px;background:repeating-linear-gradient(90deg,var(--blue) 0 28px,#fff 28px 56px);border-bottom:3px solid var(--ink)}
.tu-barra{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:14px;flex-wrap:wrap}
.tu-tipo{font-size:12px;padding:3px 10px;border-radius:999px}.tu-tipo:empty{display:none}
.tu-tipo.erro{background:var(--red-l);color:var(--red)}.tu-tipo.alternativo{background:var(--blue-l);color:var(--blue)}
.tu-pontos{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tu-pontos button{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);background:#fff;cursor:pointer;padding:0}
.tu-pontos button.visto{background:var(--blue-l)}.tu-pontos button.on{background:var(--yellow);transform:scale(1.25)}
.tu-pontos button.erro{border-color:var(--red)}.tu-pontos button.alternativo{border-color:var(--blue)}

.tu-palco{position:relative;overflow:hidden;background:#E9EEF6;transition:height .35s}
.tu-cam{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .8s cubic-bezier(.3,.1,.2,1);--z:1}
.tu-cam.sem-anim{transition:none}
.tu-cam img{display:block;width:100%;height:auto;user-select:none}
.tu-holo{position:absolute;border-radius:8px;box-shadow:0 0 0 9999px rgba(14,24,44,0);transition:box-shadow .5s,outline-color .5s;outline:3px solid transparent;outline-offset:3px;pointer-events:none}
.tu-holo.on{box-shadow:0 0 0 9999px rgba(14,24,44,.5);outline-color:var(--yellow);animation:tuPulso 1.6s ease-in-out infinite}
.tu-holo.erro.on{outline-color:var(--red)}
@keyframes tuPulso{50%{outline-offset:7px}}
/* cursor e onda ficam do mesmo tamanho com qualquer zoom (escala inversa) */
.tu-cursor{position:absolute;width:30px;height:40px;opacity:0;transition:opacity .25s;pointer-events:none;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.25));z-index:3;transform:scale(calc(1 / var(--z)));transform-origin:0 0}
.tu-cursor.on{opacity:1}
.tu-onda{position:absolute;width:0;height:0;pointer-events:none;z-index:2;transform:scale(calc(1 / var(--z)))}
.tu-onda::after{content:"";position:absolute;width:18px;height:18px;left:-9px;top:-9px;border-radius:50%;border:3px solid var(--yellow);opacity:0}
.tu-onda.on::after{animation:tuOnda .7s ease-out}
@keyframes tuOnda{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(3.2)}}

.tu-fala{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-top:3px solid var(--ink);background:var(--paper)}
.tu-mascote{flex:0 0 auto;animation:tuBoing 1.2s ease-in-out infinite}
@keyframes tuBoing{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tu-balao{position:relative;flex:1;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 16px;min-height:86px}
.tu-balao::before{content:"";position:absolute;left:-10px;top:20px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.tu-balao b{font-size:18px}.tu-balao p{margin:4px 0 0;font-size:16px;color:var(--ink2)}
.tu-dica{margin-top:10px!important;padding:8px 12px;border-radius:10px;background:var(--yellow-l);color:#5E4300!important;font-size:15px!important}
.tu-dica span{font-weight:800}
.tu-ctrl{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:12px 18px 16px;background:var(--paper)}
.tu-ctrl .btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:3px 3px 0 var(--ink)}

.tu-info{margin-top:22px;padding:16px 20px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.tu-info h2{margin:0 0 8px;font-size:18px}.tu-info li{margin:4px 0}
.tu-check{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.tu-check li::before{content:"☐ ";font-weight:800;color:var(--blue)}
.tu-prox-etapa{margin-top:22px;font-weight:700}.tu-prox-etapa span{color:var(--muted)}

@media (max-width:640px){.tu h1{font-size:22px}.tu-fala{flex-direction:column}.tu-balao::before{display:none}.tu-ctrl .btn{flex:1 1 45%}}

/* idioma (PT | ES) */
.tu-topo-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tu-lang{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:2px 2px 0 var(--ink);margin-left:auto}
.tu-lang button{border:0;background:#fff;padding:5px 12px;font:800 13px/1 Consolas,monospace;cursor:pointer;color:var(--ink)}
.tu-lang button.on{background:var(--yellow)}
.tu-aviso-lang{flex-basis:100%;margin:6px 0 0;font-size:13px;color:var(--muted)}
.tu > .tu-lang{float:right;margin-top:-52px}

body{padding-top:0}
</style>

  /* ---------- player de uma etapa ---------- */
  var eid = params.get('e') || D.etapas[0].id;
  var etapa = D.etapas.filter(function (e) { return e.id === eid })[0] || D.etapas[0];
  var passos = D.passos.filter(function (p) { return p.etapa === etapa.id });
  var idxEtapa = D.etapas.indexOf(etapa), proxima = D.etapas[idxEtapa + 1];
  var base = window.TUTORIAL_BASE || 'assets/tutoriais/pt/';
  function src(p) { return /^(data:|https?:)/.test(p.img) ? p.img : base + p.img }

  raiz.innerHTML =
    '<div class="tu-topo-linha"><a class="tu-voltar" href="tutoriais.html">' + TXT.voltar + '</a>' + seletorIdioma() + '</div>' +
    '<p class="tu-bloco-nome">' + etapa.bloco + '</p><h1><span class="tu-num">' + etapa.id + '</span> ' + etapa.titulo + '</h1>' +
    '<p class="lead">' + etapa.resumo + '</p>' +
    '<div class="tu-player" tabindex="0" aria-label="Player do tutorial">' +
    '  <div class="tu-barra"><span id="tuCont"></span><span id="tuTipo" class="tu-tipo"></span><div class="tu-pontos" id="tuPontos"></div></div>' +
    '  <div class="tu-palco" id="tuPalco"><div class="tu-cam" id="tuCam"><img id="tuImg" alt=""/><div class="tu-holo" id="tuHolo"></div>' +
    '    <div class="tu-onda" id="tuOnda"></div><div class="tu-cursor" id="tuCursor">' + CURSOR + '</div></div></div>' +
    '  <div class="tu-fala"><div class="tu-mascote">' + mascote(64) + '</div><div class="tu-balao"><b id="tuTit"></b><p id="tuTexto"></p><p class="tu-dica" id="tuDica"></p></div></div>' +
    '  <div class="tu-ctrl"><button class="btn ghost" id="tuAnt">' + TXT.ant + '</button><button class="btn amarelo" id="tuPlay">' + TXT.tocar + '</button>' +
    '    <button class="btn ghost" id="tuZoom">' + TXT.inteira + '</button><button class="btn" id="tuProx">' + TXT.prox + '</button></div>' +
    '</div>' +
    (etapa.porque ? '<div class="tu-info"><h2>💡 ' + TXT.porque + '</h2><ul>' + etapa.porque.map(function (t) { return '<li>' + t + '</li>' }).join('') + '</ul></div>' : '') +
    (etapa.checklist ? '<div class="tu-info"><h2>🧰 ' + TXT.check + '</h2><ul class="tu-check">' + etapa.checklist.map(function (t) { return '<li>' + t + '</li>' }).join('') + '</ul></div>' : '') +
    (proxima ? '<p class="tu-prox-etapa">' + TXT.proxEtapa + ': ' + (proxima.status === 'em breve' ? '<span>' + proxima.id + ' · ' + proxima.titulo + ' (' + TXT.emBreve + ')</span>' : '<a class="btn" href="tutorial.html?e=' + proxima.id + '">' + proxima.id + ' · ' + proxima.titulo + ' →</a>') + '</p>' : '');

  var img = $('#tuImg'), cam = $('#tuCam'), palco = $('#tuPalco'), holo = $('#tuHolo'), cur = $('#tuCursor'), onda = $('#tuOnda');
  var i = 0, aproximar = true, tocando = null, timers = [], curPos = { x: .5, y: .5 };
  $('#tuPontos').innerHTML = passos.map(function (p, k) { return '<button data-k="' + k + '" class="' + (p.tipo !== 'passo' ? p.tipo : '') + '" title="' + (p.titulo || p.id) + '"></button>' }).join('');
  passos.forEach(function (p) { var im = new Image(); im.src = src(p) });   // pré-carrega

  function limpa() { timers.forEach(clearTimeout); timers = [] }
  function depois(ms, f) { timers.push(setTimeout(f, ms)) }

  // palco com altura fixa (cabe no projetor); a "câmera" leva o print inteiro e se move/aproxima por cima
  function enquadra(p) {
    var a = p.alvo, W = palco.clientWidth, Hp = Math.round(Math.min(W * 0.6, window.innerHeight * 0.56)), Hi = W * p.h / p.w;
    palco.style.height = Hp + 'px'; cam.style.width = W + 'px'; cam.style.height = Hi + 'px';
    var cheio = Math.min(1, Hp / Hi), z, tx, ty;
    if (!aproximar) { z = cheio; tx = (W - W * z) / 2; ty = (Hp - Hi * z) / 2 }
    else {
      // zoom suave: o alvo ocupa ~40% do palco, sem passar de 2x
      // ...e nunca além da nitidez real do print (p.w = pixels reais da imagem)
      z = Math.max(cheio, Math.min(2, 1.15 * p.w / W, 0.4 * W / (a[2] * W), 0.4 * Hp / (a[3] * Hi)));
      var cx = (a[0] + a[2] / 2) * W, cy = (a[1] + a[3] / 2) * Hi;
      tx = W * z <= W ? (W - W * z) / 2 : Math.min(0, Math.max(W - W * z, W / 2 - cx * z));
      ty = Hi * z <= Hp ? (Hp - Hi * z) / 2 : Math.min(0, Math.max(Hp - Hi * z, Hp / 2 - cy * z));
    }
    cam.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + z + ')';
    cam.style.setProperty('--z', z);
  }

  function mostra(k, animar) {
    limpa(); geracao++; i = Math.max(0, Math.min(passos.length - 1, k)); var p = passos[i], a = p.alvo;
    $('#tuCont').textContent = TXT.passo + ' ' + (i + 1) + ' ' + TXT.de + ' ' + passos.length;
    var t = $('#tuTipo'); t.textContent = p.tipo === 'erro' ? TXT.erro : p.tipo === 'alternativo' ? TXT.alt : ''; t.className = 'tu-tipo ' + p.tipo;
    [].forEach.call($('#tuPontos').children, function (b, n) { b.classList.toggle('on', n === i); b.classList.toggle('visto', n < i) });
    $('#tuTit').textContent = p.titulo || ''; $('#tuTexto').textContent = p.texto;
    var dica = $('#tuDica'); dica.innerHTML = p.dica ? '<span>💬 ' + TXT.anot + ':</span> ' + p.dica : ''; dica.style.display = p.dica ? '' : 'none';
    $('#tuAnt').disabled = i === 0; $('#tuProx').textContent = i === passos.length - 1 ? TXT.fim : TXT.prox;
    // 1) troca a imagem já enquadrada no alvo anterior, 2) aproxima, 3) acende o holofote, 4) cursor anda e clica
    holo.classList.remove('on'); onda.classList.remove('on'); cur.classList.remove('on');
    cam.classList.toggle('sem-anim', !animar);
    img.src = src(p);
    holo.style.left = a[0] * 100 + '%'; holo.style.top = a[1] * 100 + '%'; holo.style.width = a[2] * 100 + '%'; holo.style.height = a[3] * 100 + '%';
    holo.classList.toggle('erro', p.tipo === 'erro');
    var alvo = { x: a[0] + a[2] / 2, y: a[1] + a[3] / 2 };
    var vai = function () {
      enquadra(p);
      depois(animar ? 750 : 0, function () {
        holo.classList.add('on');
        if (!p.clique) return;
        cur.classList.add('on');
        pula(curPos, alvo, animar ? 900 : 0, function () {
          curPos = alvo;
          onda.style.left = alvo.x * 100 + '%'; onda.style.top = alvo.y * 100 + '%';
          onda.classList.remove('on'); void onda.offsetWidth; onda.classList.add('on');
        });
      });
    };
    if (img.complete && img.naturalWidth) vai(); else img.onload = function () { img.onload = null; vai() };
  }

  // cursor com saltinhos (boing-boing) até o alvo
  var geracao = 0;
  function pula(de, para, ms, fim) {
    var g = ++geracao;
    if (!ms) { posCursor(para); fim(); return }
    var ini = Date.now(), saltos = 3;
    (function passo() {
      if (g !== geracao) return;   // outro passo começou: abandona esta animação
      var f = Math.min(1, (Date.now() - ini) / ms), e = f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
      var hop = Math.abs(Math.sin(f * Math.PI * saltos)) * (1 - f) * 0.05;
      posCursor({ x: de.x + (para.x - de.x) * e, y: de.y + (para.y - de.y) * e - hop });
      if (f < 1) setTimeout(passo, 16); else fim();
    })();
  }
  function posCursor(p) { cur.style.left = p.x * 100 + '%'; cur.style.top = p.y * 100 + '%' }

  function toca(on) {
    clearInterval(tocando); tocando = null; $('#tuPlay').textContent = on ? TXT.pausar : TXT.tocar;
    if (on) tocando = setInterval(function () { if (i < passos.length - 1) mostra(i + 1, true); else toca(false) }, 6500);
  }
  $('#tuAnt').onclick = function () { toca(false); mostra(i - 1, true) };
  $('#tuProx').onclick = function () { toca(false); if (i < passos.length - 1) mostra(i + 1, true); else if (proxima && proxima.status !== 'em breve') location.href = 'tutorial.html?e=' + proxima.id };
  $('#tuPlay').onclick = function () { if (tocando) toca(false); else { toca(true); if (i === passos.length - 1) mostra(0, true) } };
  $('#tuZoom').onclick = function () { aproximar = !aproximar; this.textContent = aproximar ? TXT.inteira : TXT.zoom; enquadra(passos[i]) };
  $('#tuPontos').onclick = function (ev) { var k = ev.target.getAttribute('data-k'); if (k !== null) { toca(false); mostra(+k, true) } };
  $('.tu-player').onkeydown = function (ev) { if (ev.key === 'ArrowRight') $('#tuProx').click(); if (ev.key === 'ArrowLeft') $('#tuAnt').click(); if (ev.key === ' ') { ev.preventDefault(); $('#tuPlay').click() } };
  window.addEventListener('resize', function () { enquadra(passos[i]) });
  posCursor(curPos); mostra(0, true);
})();

</script>
</body>
</html>
